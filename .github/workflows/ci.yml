name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Check instructions and local links
        run: python scripts/check_repo.py
      - name: Check publishable source privacy
        run: python scripts/check_privacy.py
      - name: Run offline implementation and distribution tests
        run: python -m unittest discover -s tests -v
      - name: Build outside the checkout
        run: python scripts/build_plugin.py --output "$RUNNER_TEMP/japan-travel.zip"
      - name: Check final bundle privacy
        run: python scripts/check_privacy.py --archive "$RUNNER_TEMP/japan-travel.zip"
      - name: Generate bundle checksum
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          cd "$RUNNER_TEMP"
          sha256sum japan-travel.zip > SHA256SUMS
      - name: Upload checked bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: japan-travel-bundle
          path: |
            ${{ runner.temp }}/japan-travel.zip
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  security:
    name: Static analysis and dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned check tools and runtime dependencies
        run: python -m pip install -r requirements-security.txt
      - name: Check runtime dependency advisories
        run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
      - name: Check source for common security defects
        run: python -m bandit -r skills scripts -ll

  stdlib:
    name: Standard-library tools / Python 3.9
    # Keep Python 3.9 on an image with a published setup-python build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.9'
      - name: Test travel tools without installing third-party packages
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v
          test_weather test_weathernews test_jma_alerts test_jma_climate
          test_transit test_rail_operations test_ir_operations
          test_holidays test_daylight test_seasons test_fuji
          test_hotels test_hotel_geo test_hotel_viewport test_passes
          test_plan_rendering
