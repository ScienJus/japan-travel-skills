name: Publish documentation to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full SHA of the reviewed main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Match the reviewed revision
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install documentation build dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build checked static documentation
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_docs_site.py --output "$RUNNER_TEMP/docs-site" --site-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
